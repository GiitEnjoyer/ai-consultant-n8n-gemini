name: kvarta-ai-consultant

# Общие переменные окружения для n8n и одноразового контейнера инициализации.
x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
  DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Укажите N8N_ENCRYPTION_KEY в .env}
  GENERIC_TIMEZONE: Europe/Moscow
  TZ: Europe/Moscow
  # Узлы читают TELEGRAM_MANAGER_CHAT_ID и GOOGLE_SHEET_ID через $env —
  # настройки меняются в .env без правки рабочих процессов.
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  TELEGRAM_MANAGER_CHAT_ID: ${TELEGRAM_MANAGER_CHAT_ID:-}
  GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
  WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "336"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kb-service:
    build: ./kb-service
    restart: unless-stopped
    environment:
      KB_MIN_SCORE: ${KB_MIN_SCORE:-1.5}
      KB_ADMIN_TOKEN: ${KB_ADMIN_TOKEN:-}
    volumes:
      # База знаний редактируется без пересборки образа: изменить .md и вызвать POST /reload.
      - ./kb-service/knowledge:/srv/knowledge:ro
    ports:
      - "127.0.0.1:8000:8000"

  n8n-init:
    image: n8nio/n8n:${N8N_VERSION:-2.41.3}
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      <<: *n8n-env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Переопределение адресов API — для сквозного теста с заглушками (tests/e2e).
      GEMINI_API_HOST: ${GEMINI_API_HOST:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      FORCE_WORKFLOW_IMPORT: ${FORCE_WORKFLOW_IMPORT:-false}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/init:/init:ro
      - ./n8n/workflows:/workflows:ro
      - ./secrets:/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.41.3}
    restart: unless-stopped
    environment:
      <<: *n8n-env
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      kb-service:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SITE_PORT:-8080}:80"
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
