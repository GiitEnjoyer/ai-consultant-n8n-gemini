# Сайт и виджет отдаются статикой, /api/chat проксируется в webhook n8n.
# Один origin для сайта и API — CORS не требуется.
# limit_req защищает бесплатный лимит LLM от флуда: 6 сообщений в минуту с одного IP.

limit_req_zone $binary_remote_addr zone=chat:10m rate=6r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8k;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api/chat {
        limit_req zone=chat burst=4 nodelay;
        limit_req_status 429;

        limit_except POST { deny all; }

        proxy_pass http://n8n:5678/webhook/site-chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    error_page 429 = @too_many;
    location @too_many {
        default_type application/json;
        return 429 '{"error":"Слишком много сообщений. Подождите минуту."}';
    }
}
